name: 功能建议 / Feature Request
description: 提出新功能点子或对现有功能的改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提出想法！请描述清楚痛点与期望，帮助我们判断价值与可行性。
  - type: textarea
    id: problem
    attributes:
      label: 想要解决的问题
      description: 这个功能是为了解决什么实际痛点？
      placeholder: "例如：希望能一键对比两个文件夹的差异……"
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 你希望软件如何做？如果有交互或界面上的设想也可以描述。
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 补充说明
      description: 参考链接、 mockup、类似工具的参考等
    validations:
      required: false
